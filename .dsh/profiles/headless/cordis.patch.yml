# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# Since dsh 0.2 this file IS the user settings layer (the old
# ~/.dsh/settings.yaml is imported once, then renamed to
# settings.yaml.imported), so per-plugin settings live here.

# Local llama.cpp provider adapter (@deepseek-ai/dsh-llm-llamacpp): registers
# the ISOLATED `llamacpp-local` route with automatic native-tooling detection
# (/props chat_template_caps), optional auth, vision and prompt-mode fallback.
# See the web profile's cordis.patch.yml for the toolCompat/toolGuide notes.
# Alex's local tools: remove these five alex-* rows to deactivate.
- insert:
    - id: alex-file-observation-coverage
      name: /home/alex/git/my/dsh-customs/plugins/apply-patch/observation.mjs
    - id: alex-apply-patch
      name: /home/alex/git/my/dsh-customs/plugins/apply-patch/index.mjs
    - id: alex-workspace-context
      name: /home/alex/git/my/dsh-customs/plugins/workspace-context/index.mjs
    - id: alex-project-mcp
      name: /home/alex/git/my/dsh-customs/plugins/project-mcp/index.mjs
    - id: alex-clipboard
      name: /home/alex/git/my/dsh-customs/plugins/clipboard/index.mjs
    - id: alex-trash
      name: /home/alex/git/my/dsh-customs/plugins/trash/index.mjs
    - id: alex-list
      name: /home/alex/git/my/dsh-customs/plugins/list/index.mjs
    - id: alex-shell-reconsider
      name: /home/alex/git/my/dsh-customs/plugins/shell-reconsider/index.mjs
      config:
        interval: 50
        unit: steps
    - id: llm-llamacpp
      name: '@deepseek-ai/dsh-llm-llamacpp'
      config:
        baseURL: http://127.0.0.1:8080
        tooling: auto
        toolCompat: auto
        toolGuide: true
        temperature: 1.0
        maxTokens: 24576
        models:
          - id: /home/alex/.cache/huggingface/hub/models--EZForever--gemma-4-26B-A4B-it-qat-uncensored-heretic-UDmerge-GGUF/snapshots/9567a9ca99f1ee12c9d43082c7351f24b4feef63/gemma-4-26B-A4B-it-qat-uncensored-heretic-UDmerge-Q4_K_XXL.gguf
            name: Gemma 4 26B Local
            contextWindow: 65536
            maxTokens: 24576
            vision: true
            temperature: 1.0
          - id: peculiar-ragdoll/Dirk-Qwen3.8-27B-GGUF
            name: Qwen3.8 27B Local (Dirk)
            contextWindow: 62464
            maxTokens: 24576
            vision: true
            temperature: 0.8
