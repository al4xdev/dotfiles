# Dedicated mobile companion; generated by tools/session-companion/profile.mjs.
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: companion
- id: agent-default-model
  config:
    provider: google-antigravity
    model: gemini-3.8-flash-low
    reasoningEffort: low
# Pure API model: no harness identity or persona lines in the system prompt (the
# companion preset has no persona row of its own, so these root keys are the only
# source); anything the owner wants goes visibly in AGENTS-Companion.md.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''
    personaSuffix: ''
- id: session-persistence-jsonl
  config:
    root: /home/alex/.dsh/sessions
    compression: zstd
- id: approval
  config:
    policy: ask
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
    defaultPreset: workspace-write
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: /home/alex/git/my/dsh-companion-workspace
- id: session-controller
  disabled: true
- insert:
    - id: companion-session-controller
      name: ../../../git/my/dsh-customs/plugins/companion-workspace/session-controller.mjs
- id: tool-fs
  disabled: true
- id: tool-bash
  disabled: true
- id: session-title-llm
