# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Alex's local tools: remove this insert entry to deactivate.
- insert:
    - id: alex-file-observation-coverage
      name: /home/alex/git/my/dsh-customs/plugins/apply-patch/observation.mjs
    - id: alex-apply-patch
      name: /home/alex/git/my/dsh-customs/plugins/apply-patch/index.mjs
    - id: alex-workspace-context
      name: /home/alex/git/my/dsh-customs/plugins/workspace-context/index.mjs
    - id: alex-project-mcp
      name: /home/alex/git/my/dsh-customs/plugins/project-mcp/index.mjs
    - id: alex-browser
      name: /home/alex/git/my/dsh-customs/plugins/browser/index.mjs
    - id: alex-clipboard
      name: /home/alex/git/my/dsh-customs/plugins/clipboard/index.mjs
    - id: alex-trash
      name: /home/alex/git/my/dsh-customs/plugins/trash/index.mjs
    - id: alex-list
      name: /home/alex/git/my/dsh-customs/plugins/list/index.mjs
    - id: alex-shell-reconsider
      name: /home/alex/git/my/dsh-customs/plugins/shell-reconsider/index.mjs
      config:
        interval: 50
        unit: steps
- id: llm-retry
  disabled: true
- insert:
    - id: alex-llm-resilience
      name: /home/alex/git/my/dsh-customs/plugins/llm-resilience/lib/index-v5-unified.mjs
      config: {}
    - id: alex-codex-transient-close
      name: /home/alex/git/my/dsh-customs/plugins/codex-transient-close/index.mjs
      config: {}
    - id: alex-agent-self-heal
      name: /home/alex/git/my/dsh-customs/plugins/agent-self-heal/lib/index-v6-unified.mjs
      config: {}
# BEGIN alex-research activation v1
- insert:
    - id: alex-research
      name: /home/alex/git/my/dsh-customs/plugins/research/index.mjs
- id: tool-web
  name: "@deepseek-ai/dsh-tool-web"
  config:
    fetch: true
    searchTimeoutMs: 60000
    search: false
# END alex-research activation v1
