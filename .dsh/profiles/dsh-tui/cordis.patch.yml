# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# O provider `strata-local` (servidor local) é injetado dinamicamente pelo
# launcher do `dsht`; a descoberta decide o modelo. Aqui fica só o default
# global da sessão — o `dsht` não fixa mais nenhum modelo.
- id: agent-default-model
  config:
    provider: openai-codex
    model: gpt-6.1-sol
    reasoningEffort: low
# Native delegation selection is captured only by fresh root sessions.
- id: dsh-tui-subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: openai-codex
        model: gpt-6.1-sol
      - provider: openai-codex
        model: gpt-6-luna
# Long-lived Codex agents: bounded provider retry, last wait18–20min with jitter.
# 190k is the pressure ceiling for this 272k model; safety reserves may trigger earlier.
- id: compaction-basic
  config:
    auto: true
    modelPolicies:
      - provider: openai-codex
        model: gpt-6.1-sol
        thresholdRatio: 0.69853
# Research uses the existing Google OAuth; web_fetch stays on the HTTP provider.
- id: web
  config:
    searchProvider: google-antigravity
    fetchProvider: http
- id: web-search-deepseek
  disabled: true
# Quota resets use a separate24h cap; keep exactly one recovery engine.
- id: llm-retry
  disabled: true
# Harness recovery: reset hints never extend the shared cap (at most 60min); larger minimums suspend.
- id: llm-pi-ai-antigravity
  config:
    webSearch: true
    searchModel: gemini-3.8-flash-low
    quotaResetRetry:
      enabled: true
      maxWaitMs: 86400000
- id: session-title-llm
  disabled: true
- id: plan-mode
  disabled: true
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: dsh-tui
  config:
    fullscreen: true
    terminalImages: true
    externalPlanCommand: true
    lang: en
    companion:
      skin: whaleGirl
    shortcuts:
      editor: ctrl+shift+g
# Alex's local tools: remove these alex-* rows to deactivate.
- insert:
    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        order: 1
        plugins:
          - id: standard-managed-plugins
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: /home/alex/.dsh/profiles/dsh-tui/standard-managed-plugins.yml
    - id: alex-codex-transient-close
