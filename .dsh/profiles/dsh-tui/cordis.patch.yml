# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# O provider `strata-local` (servidor local) é injetado dinamicamente pelo
# launcher do `dsht`; a descoberta decide o modelo. Aqui fica só o default
# global da sessão — o `dsht` não fixa mais nenhum modelo.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: low
# Native delegation selection is captured only by fresh root sessions.
# Order is the order the subagent picker renders: deepseek-flash first.
- id: dsh-tui-subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      # DeepSeek flash: the default child route (catalog id of dsh-llm-deepseek).
      - provider: deepseek-official
        model: deepseek-flash
      # Google Anti Gravity. `gemini-4-pro` is not in the Cloud Code Assist
      # catalog yet: the Gemini 4 Argon trial exposes gemini-4-argon-high,
      # -medium and -low (plugins/dsh-antigravity/src/models.ts).
      - provider: google-antigravity
        model: gemini-4-argon-high
      # Gemini 3.8 Flash. Effort is the model id, not a separate reasoning field
      # (plugins/dsh-antigravity/src/models.ts).
      - provider: google-antigravity
        model: gemini-3.8-flash-high
      - provider: google-antigravity
        model: gemini-3.8-flash-medium
      - provider: google-antigravity
        model: gemini-3.8-flash-low
      # xAI Grok. Catalog id of the signed-in `xai` route; matches ~/.dsh-tui/model.json.
      - provider: xai
        model: grok-4.7
# Long-lived Codex agents: bounded provider retry, last wait18–20min with jitter.
# 190k is the pressure ceiling for this 272k model; safety reserves may trigger earlier.
- id: compaction-basic
  config:
    auto: true
    modelPolicies:
      - provider: openai-codex
        model: gpt-6.1-sol
        thresholdRatio: 0.69853
# Research uses the existing Google OAuth; web_fetch stays on the HTTP provider.
- id: web
  config:
    searchProvider: google-antigravity
    fetchProvider: http
- id: web-search-deepseek
  disabled: true
# No telemetry to DeepSeek: the dsh-base row that ships session-log excerpts (after
# feedback) to dsh-otel-collector.deepseeksvc.com stays off in every profile.
- id: session-telemetry-otel
  disabled: true
# Quota resets use a separate24h cap; keep exactly one recovery engine.
- id: llm-retry
  disabled: true
# Harness recovery: provider reset hints are waited up to the shared 24h provider-wait cap; larger minimums suspend.
- id: llm-pi-ai-antigravity
  config:
    webSearch: true
    searchModel: gemini-3.8-flash-low
    quotaResetRetry:
      enabled: true
      maxWaitMs: 86400000
- id: session-title-llm
  disabled: true
- id: plan-mode
  disabled: true
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: dsh-tui
  config:
    externalPlanCommand: true
    updateCheck: false
    fullscreen: true
    terminalImages: true
    lang: en
    toolBackground: none
    companion:
      skin: whaleGirl
    shortcuts:
      editor: ctrl+shift+g
# Pure API model voice: no ⏵ self-narration contract in the system prompt (its
# "optionally playful" clause leaked into answers). Bundle keys are repeated
# because a config patch replaces the whole block.
- id: working-activity
  config:
    publish: false
    publishIntervalMs: 500
    narrate: false
# Pure API model: no harness identity or persona line in the system prompt; a
# persona the owner wants goes visibly in his AGENTS.md. Replaces the bundle's
# version-sniffing `!!js` config (0.2.x reads `personaPrefix`).
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''
# Alex's local tools: remove these alex-* rows to deactivate.
- insert:
    # Defines the preset; the bash-first config patch further down overrides its
    # plugin list. Removing this block leaves "Unknown agent preset: standard".
    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        order: 1
        plugins:
          - id: standard-managed-plugins
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: ./standard-managed-plugins.yml
    - id: alex-research
      name: ../../../git/my/dsh-customs/plugins/research/index.mjs
    - id: alex-llm-resilience
      name: ../../../git/my/dsh-customs/plugins/llm-resilience/lib/index-v6-unified.mjs
      config:
        {}
    - id: alex-codex-transient-close
      name: ../../../git/my/dsh-customs/plugins/codex-transient-close/index.mjs
    - id: alex-agent-self-heal
      name: ../../../git/my/dsh-customs/plugins/agent-self-heal/lib/index-v7-unified.mjs
      config:
        {}
    - id: alex-session-bridge
      name: ../../../git/my/dsh-customs/plugins/session/bridge.mjs
    - id: alex-file-observation-coverage
      name: ../../../git/my/dsh-customs/plugins/apply-patch/observation.mjs
    - id: alex-workspace-context
      name: ../../../git/my/dsh-customs/plugins/workspace-context/index.mjs
    - id: alex-project-mcp
      name: ../../../git/my/dsh-customs/plugins/project-mcp/index.mjs
    - id: alex-browser
      name: ../../../git/my/dsh-customs/plugins/browser/index.mjs
    - id: alex-music
      name: ../../../git/my/dsh-customs/plugins/music/index.mjs
    - id: alex-claude-bare-dsh
      name: ../../../git/my/dsh-customs/plugins/claude-bare-dsh/index.mjs
    - id: alex-clipboard
      name: ../../../git/my/dsh-customs/plugins/clipboard/index.mjs
    - id: alex-trash
      name: ../../../git/my/dsh-customs/plugins/trash/index.mjs
    - id: alex-wait
      name: ../../../git/my/dsh-customs/plugins/wait/index.mjs
    - id: alex-peak-gate
      name: ../../../git/my/dsh-customs/plugins/peak-gate/index.mjs
    - id: alex-grammar-fix
      name: ../../../git/my/dsh-customs/plugins/grammar-fix/index.mjs
      config:
        model: strata-local/gemma4-26b-a4b
        language: en
        naturalTips: false
    - id: alex-managed-plans
      name: ../../../git/my/dsh-customs/plugins/managed-plans/index.mjs
      config:
        wakeAgent: true
        autonomousByDefault: false
    - id: alex-managed-plans-tui
      name: ../../../git/my/dsh-customs/plugins/managed-plans/tui.mjs
    - id: antigravity-tui-login
      name: ../../../git/my/dsh-customs/plugins/dsh-antigravity/tui-login.mjs
# The `standard` preset is bash-first (2026-11-13). Frontier models (trained on Claude
# Code) read, list and search through the shell, so tools that duplicate it only cost
# prefix and steer against training. Against the stock composition:
# - alex-bash-tools replaces tool-bash: the stock tool plus the frontier shell practice
#   (bound output, batch probes with `;`, `&&` for dependent steps) in its description;
# - alex-fs-tools replaces tool-fs: one `read` for text and images, no `read_image`, and
#   no "not shell commands like cat" prose;
# - no tool-fs-search (glob, grep): rg/find/ls in bash;
# - alex-tool-result-clearing replaces tool-result-pruner: old tool output leaves the
#   prompt when the cache is already cold or under pressure, before any summary;
# - no subagent_fork and no workflow (0 and 6 calls in 200 sessions).
# This patch comes after the research block on purpose: the stock list lives in a frozen
# research derivative (alex-research-a2d9…), and the last config patch wins. Deleting this
# entry restores the stock composition.
- id: preset-standard
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: ''
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: alex-bash-tools
        name: ../../../git/my/dsh-customs/plugins/bash-tools/index.mjs
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: alex-fs-tools
        name: ../../../git/my/dsh-customs/plugins/fs-tools/index.mjs
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: alex-tool-result-clearing
            name: ../../../git/my/dsh-customs/plugins/tool-result-clearing/index.mjs
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
              keepRecent: 12
              clearAtLeastTokens: 20000
              idleSeconds: 3900
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
          search: false
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
