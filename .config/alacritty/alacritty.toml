[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "L"
mods = "Control"
chars = "\u0017"

[bell]
command = { program = "pw-play", args = ["/usr/share/sounds/freedesktop/stereo/message.oga"] }
duration = 100
animation = "EaseOutExpo"

