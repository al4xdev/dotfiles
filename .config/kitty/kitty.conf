# ==============================================================================
# Kitty default profile (COSMIC; Cage uses kitty-cage.conf)
# ==============================================================================

# --- Font Settings ---
font_family      family="JetBrainsMono Nerd Font Mono" style="Regular"
bold_font        family="JetBrainsMono Nerd Font Mono" style="Bold"
italic_font      family="JetBrainsMono Nerd Font Mono" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size        12.0
modify_font      cell_height 115%

# --- Cursor Settings ---
cursor_shape          beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 0

# Visual smooth movement effect (Kitty 0.35+)
# Substitui o "smooth motion" do fork do Alacritty usando rastro/animação de movimento
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_trail_start_threshold 2

# --- Window & Appearance ---
background_opacity       0.9
background_blur          32
window_padding_width     8 10
hide_window_decorations  yes
confirm_os_window_close  0

# --- Bell Settings ---
enable_audio_bell yes
command_on_bell   pw-play /usr/share/sounds/freedesktop/stereo/message.oga

# --- Terminal workspaces ---
enabled_layouts splits
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_style separator
tab_separator "   "
tab_bar_align left
tab_bar_margin_width 8
tab_bar_margin_height 4 4
active_tab_font_style bold
inactive_tab_font_style normal
# Mascotes: gato, alien, fantasma, robô, inseto, foguete, peixe, pato e cogumelo.
# Decoração do número, sem consultar processos ou executar comandos.
tab_title_template "  {title} { {'1': '󰄛', '2': '󰢚', '3': '󰊠', '4': '󰚩', '5': '󰃤', '6': '󰑣', '7': '󰈺', '8': '󰇥', '9': '󰟟'}.get(title, '')}  "

# --- Keybindings ---
# Mantém apenas os atalhos explícitos abaixo, sem restaurar os padrões.
clear_all_shortcuts yes

# Atalhos Super ficam exclusivos do perfil Cage; o COSMIC pode usá-los.

# Custom bindings
map ctrl+l       send_text all \x17
map shift+enter  send_text all \x1b[13;2u

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrollback navigation (match Alacritty behavior)
map page_up         scroll_page_up
map page_down       scroll_page_down
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down


# --- Color Scheme: Catppuccin Mocha ---
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# URL color
url_color               #f5e0dc

# Window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# Barra discreta; só o workspace ativo ganha uma placa lilás.
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #a6adc8
inactive_tab_background #181825
tab_bar_background      #181825
tab_bar_margin_color    #181825

# Terminal Colors (0-15)
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
